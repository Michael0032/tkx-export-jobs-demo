:root{--bg:#F6F5F2;--card:#FFFFFF;--soft:#F1EFE8;--line:#E3E1DA;--txt:#1F1F1D;--mut:#6B6A65;--acc:#185FA5;--acc-bg:#E6F1FB;

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}

<script>/* logic_en.js — pure business logic (no I/O). Dates are 'YYYY-MM-DD' strings; reporting currency USD. */

var LOGIC_DEFAULTS = {
  CLIENT_DAYS_BEFORE_ETD: 10,
  SUPPLIER_DAYS_BEFORE_ETD: 0,
  FREIGHT_DAYS_BEFORE_ETD: 0,
  WARN_DAYS: 5,
  ETD_NOTICE_DAYS: 7,
  ETA_NOTICE_DAYS: 5,
  BL_DAYS_AFTER_ETD: 7,
  PRESHIP_DOC_DAYS_BEFORE_ETD: 3,
  DOC_SEND_DAYS: 2,
  TOLERANCE_USD: 50
};
var CLIENT_FACING_DOCS = ['BL', 'BIETC', 'Inspection', 'Sales invoice', 'Certificate of origin', 'Packing list'];
var PRESHIP_DOCS = ['BIETC', 'Inspection'];
var COMMIT_CATEGORIES = ['Supplier', 'Freight', 'Inspection', 'BIETC', 'Commission', 'Other'];
var CLOSED_STATUSES = ['Closed', 'Cancelled'];

function lgCfg(cfg) {
  var out = {};
  for (var k in LOGIC_DEFAULTS) out[k] = LOGIC_DEFAULTS[k];
  if (cfg) for (var c in cfg) {
    if (cfg[c] === '' || cfg[c] === null || cfg[c] === undefined) continue;
    out[c] = (typeof LOGIC_DEFAULTS[c] === 'number') ? Number(cfg[c]) : cfg[c];
  }
  return out;
}
function lgDay(s) {
  if (!s) return null;
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000);
}
function lgDate(day) { if (day === null || day === undefined) return ''; return new Date(day * 86400000).toISOString().slice(0, 10); }
function lgAddDays(s, n) { var d = lgDay(s); return d === null ? '' : lgDate(d + n); }
function lgNum(v) { if (v === null || v === undefined || v === '') return 0; if (typeof v === 'number') return v; return lgParseAmount(String(v)); }
function lgParseAmount(s) {
  s = String(s).replace(/[\s ']/g, '');
  if (!s) return 0;
  var lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) { s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (lc > -1) {
    var dec = s.length - lc - 1, commas = (s.match(/,/g) || []).length;
    s = (commas === 1 && dec !== 3) ? s.replace(',', '.') : s.replace(/,/g, '');
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function lgToUSD(amount, ccy, rate) {
  amount = lgNum(amount);
  if (!ccy || ccy === 'USD') return amount;
  var r = lgNum(rate);
  return r > 0 ? amount / r : 0;
}
function lgRound(n) { return Math.round(n * 100) / 100; }
function lgTrue(v) { return v === true || v === 'TRUE' || v === 'true' || v === 1; }

function lgSummarizeJob(job, commitments, txs, docs, cfg, today) {
  cfg = lgCfg(cfg);
  var tol = cfg.TOLERANCE_USD;
  var s = { jobId: job.jobId, pfi: job.salesPfi, client: job.client, country: job.country,
    etd: job.etd || '', eta: job.eta || '', manualStatus: job.status || '',
    saleUSD: lgRound(lgToUSD(job.saleAmount, job.saleCcy, job.saleRate)),
    receivedUSD: 0, commit: {}, paid: {}, due: {}, deadlines: {}, missingFx: false, cashWithoutProof: 0 };
  COMMIT_CATEGORIES.forEach(function (c) { s.commit[c] = 0; s.paid[c] = 0; s.due[c] = 0; });
  if (job.saleCcy && job.saleCcy !== 'USD' && !(lgNum(job.saleRate) > 0)) s.missingFx = true;
  var earliest = {};
  commitments.forEach(function (e) {
    var cat = COMMIT_CATEGORIES.indexOf(e.category) > -1 ? e.category : 'Other';
    if (e.ccy && e.ccy !== 'USD' && !(lgNum(e.rate) > 0)) s.missingFx = true;
    s.commit[cat] += lgToUSD(e.amount, e.ccy, e.rate);
    if (e.dueDate) { var d = lgDay(e.dueDate); if (earliest[cat] === undefined || d < earliest[cat]) earliest[cat] = d; }
  });
  txs.forEach(function (t) {
    if (t.ccy && t.ccy !== 'USD' && !(lgNum(t.rate) > 0)) s.missingFx = true;
    var usd = lgToUSD(t.amount, t.ccy, t.rate);
    if (t.dir === 'IN') s.receivedUSD += usd;
    else {
      var cat = COMMIT_CATEGORIES.indexOf(t.category) > -1 ? t.category : 'Other';
      s.paid[cat] += usd;
      if (t.mode === 'Cash' && !t.fileId) s.cashWithoutProof++;
    }
  });
  var tc = 0, tp = 0;
  COMMIT_CATEGORIES.forEach(function (c) {
    s.commit[c] = lgRound(s.commit[c]); s.paid[c] = lgRound(s.paid[c]);
    s.due[c] = lgRound(Math.max(0, s.commit[c] - s.paid[c])); if (s.due[c] < tol) s.due[c] = 0;
    tc += s.commit[c]; tp += s.paid[c];
  });
  s.receivedUSD = lgRound(s.receivedUSD);
  s.receivableUSD = lgRound(Math.max(0, s.saleUSD - s.receivedUSD)); if (s.receivableUSD < tol) s.receivableUSD = 0;
  s.totalCommitUSD = lgRound(tc); s.totalPaidUSD = lgRound(tp);
  s.totalDueUSD = lgRound(COMMIT_CATEGORIES.reduce(function (a, c) { return a + s.due[c]; }, 0));
  s.cashNetUSD = lgRound(s.receivedUSD - s.totalPaidUSD);
  s.expectedMarginUSD = lgRound(s.saleUSD - s.totalCommitUSD);
  s.pctReceived = s.saleUSD > 0 ? Math.min(100, Math.round(s.receivedUSD / s.saleUSD * 100)) : 0;
  s.pctSupplierPaid = s.commit.Supplier > 0 ? Math.min(100, Math.round(s.paid.Supplier / s.commit.Supplier * 100)) : 0;
  if (s.etd) {
    s.deadlines.client = lgAddDays(s.etd, -cfg.CLIENT_DAYS_BEFORE_ETD);
    s.deadlines.Supplier = lgAddDays(s.etd, -cfg.SUPPLIER_DAYS_BEFORE_ETD);
    s.deadlines.Freight = lgAddDays(s.etd, -cfg.FREIGHT_DAYS_BEFORE_ETD);
  }
  COMMIT_CATEGORIES.forEach(function (c) {
    if (earliest[c] !== undefined) {
      var rule = s.deadlines[c] ? lgDay(s.deadlines[c]) : null;
      s.deadlines[c] = lgDate(rule === null ? earliest[c] : Math.min(rule, earliest[c]));
    } else if (!s.deadlines[c] && s.etd) s.deadlines[c] = s.etd;
  });
  var req = 0, rec = 0, toSend = 0;
  s.docs = docs.map(function (d) {
    var required = d.status !== 'N/A'; if (required) req++;
    var received = d.status === 'Received'; if (required && received) rec++;
    var mustSend = received && CLIENT_FACING_DOCS.indexOf(d.type) > -1 && !lgTrue(d.sentToClient);
    if (mustSend) toSend++;
    return { id: d.id, type: d.type, status: d.status, sent: lgTrue(d.sentToClient), mustSend: mustSend };
  });
  s.docsRequired = req; s.docsReceived = rec; s.docsToSend = toSend;
  s.status = lgStatus(s, today);
  return s;
}
function lgStatus(s, today) {
  if (CLOSED_STATUSES.indexOf(s.manualStatus) > -1) return s.manualStatus;
  var t = lgDay(today), etd = lgDay(s.etd), eta = lgDay(s.eta), phase = 'Preparing';
  if (etd !== null && t >= etd) phase = 'At sea';
  if (eta !== null && t >= eta) phase = 'Arrived';
  if (phase === 'Arrived' && s.receivableUSD === 0 && s.totalDueUSD === 0 && s.docsReceived >= s.docsRequired && s.docsToSend === 0) phase = 'Ready to close';
  return phase;
}
function lgSchedule(summaries) {
  var rec = [], pay = [];
  summaries.forEach(function (s) {
    if (CLOSED_STATUSES.indexOf(s.status) > -1) return;
    if (s.receivableUSD > 0) rec.push({ jobId: s.jobId, pfi: s.pfi, party: s.client, label: 'Client balance', amountUSD: s.receivableUSD, date: s.deadlines.client || '' });
    COMMIT_CATEGORIES.forEach(function (c) { if (s.due[c] > 0) pay.push({ jobId: s.jobId, pfi: s.pfi, party: s.client, label: c, amountUSD: s.due[c], date: s.deadlines[c] || '' }); });
  });
  var byDate = function (a, b) { return (a.date || '9999') < (b.date || '9999') ? -1 : 1; };
  return { receivables: rec.sort(byDate), payables: pay.sort(byDate) };
}
function lgAlerts(summaries, docsByJob, cfg, today) {
  cfg = lgCfg(cfg);
  var t = lgDay(today), out = [];
  function push(level, s, type, msg, date, amount) {
    out.push({ level: level, jobId: s.jobId, pfi: s.pfi, client: s.client, type: type, message: msg, date: date || '', amountUSD: amount || 0 });
  }
  function check(s, amount, date, late, soon) {
    if (!(amount > 0) || !date) return;
    var d = lgDay(date);
    if (t > d) push('danger', s, late, late + ' (D+' + (t - d) + ')', date, amount);
    else if (d - t <= cfg.WARN_DAYS) push('warning', s, soon, soon + ' (D-' + (d - t) + ')', date, amount);
  }
  summaries.forEach(function (s) {
    if (CLOSED_STATUSES.indexOf(s.status) > -1) return;
    check(s, s.receivableUSD, s.deadlines.client, 'Client balance overdue', 'Collect client balance');
    check(s, s.due.Supplier, s.deadlines.Supplier, 'Supplier payment overdue', 'Pay supplier');
    check(s, s.due.Freight, s.deadlines.Freight, 'Freight invoice overdue', 'Pay freight');
    ['Inspection', 'BIETC', 'Commission', 'Other'].forEach(function (c) { check(s, s.due[c], s.deadlines[c], c + ' payment overdue', 'Pay ' + c); });
    var etd = lgDay(s.etd), eta = lgDay(s.eta);
    if (etd !== null && etd >= t && etd - t <= cfg.ETD_NOTICE_DAYS) push('info', s, 'Departure', 'Departure due (D-' + (etd - t) + ')', s.etd);
    if (eta !== null && eta >= t && eta - t <= cfg.ETA_NOTICE_DAYS) push('info', s, 'Arrival', 'Arrival due (D-' + (eta - t) + ')', s.eta);
    if (s.missingFx) push('warning', s, 'Missing FX rate', 'FX rate missing on a foreign-currency line', '');
    if (s.cashWithoutProof > 0) push('info', s, 'Cash proof', s.cashWithoutProof + ' cash payment(s) without receipt', '');
    (docsByJob[s.jobId] || []).forEach(function (d) {
      if (d.status === 'N/A') return;
      if (d.status !== 'Received') {
        if (d.type === 'BL' && etd !== null && t > etd + cfg.BL_DAYS_AFTER_ETD)
          push('warning', s, 'BL missing', 'BL not received (ETD + ' + (t - etd) + ' days)', lgDate(etd + cfg.BL_DAYS_AFTER_ETD));
        if (PRESHIP_DOCS.indexOf(d.type) > -1 && etd !== null && t > etd - cfg.PRESHIP_DOC_DAYS_BEFORE_ETD)
          push(t > etd ? 'danger' : 'warning', s, d.type + ' missing', d.type + ' not received before departure', lgDate(etd - cfg.PRESHIP_DOC_DAYS_BEFORE_ETD));
        if (d.type === 'Sales invoice' && etd !== null && t > etd)
          push('warning', s, 'Sales invoice', 'Sales invoice not issued after departure', s.etd);
      } else if (CLIENT_FACING_DOCS.indexOf(d.type) > -1 && !lgTrue(d.sentToClient)) {
        var r = lgDay(d.receivedOn), late = r !== null && t - r > cfg.DOC_SEND_DAYS;
        push(late ? 'warning' : 'info', s, 'To send', d.type + ' received, not sent to client', r !== null ? lgDate(r + cfg.DOC_SEND_DAYS) : '');
      }
    });
  });
  var rank = { danger: 0, warning: 1, info: 2 };
  return out.sort(function (a, b) { return rank[a.level] - rank[b.level] || ((a.date || '9999') < (b.date || '9999') ? -1 : 1); });
}
function lgKpis(summaries, schedule, today) {
  var t = lgDay(today), active = summaries.filter(function (s) { return CLOSED_STATUSES.indexOf(s.status) === -1; });
  var sum = function (arr, f) { return lgRound(arr.reduce(function (a, x) { return a + f(x); }, 0)); };
  return {
    activeJobs: active.length,
    receivable10: sum(schedule.receivables.filter(function (r) { return r.date && lgDay(r.date) - t <= 10; }), function (r) { return r.amountUSD; }),
    payableAll: sum(active, function (s) { return s.totalDueUSD; }),
    cashNet: sum(active, function (s) { return s.cashNetUSD; }),
    expectedMargin: sum(active, function (s) { return s.expectedMarginUSD; })
  };
}
function lgSuggestJob(text, jobs) {
  if (!text) return [];
  var T = String(text).toUpperCase().replace(/\s+/g, ' '), res = [];
  jobs.forEach(function (j) {
    var score = 0;
    [j.salesPfi, j.jobId].forEach(function (k) {
      if (!k) return;
      var K = String(k).toUpperCase();
      if (T.indexOf(K) > -1) score = Math.max(score, 100);
      else { var dg = K.replace(/\D/g, ''); if (dg.length >= 4 && T.replace(/\D/g, ' ').split(' ').indexOf(dg) > -1) score = Math.max(score, 80); }
    });
    if (score) res.push({ jobId: j.jobId, pfi: j.salesPfi, score: score });
  });
  return res.sort(function (a, b) { return b.score - a.score; });
}

/* ---------- Payment allocation ---------- */
/** Valid allocations of a movement: [{jobId, amount}] in the movement's currency. */

        if (!snap.metadata.fromCache) LOADED[c] = true; else if (!LOADED[c]) LOADED[c] = snap.docs.length > 0;
        if (allLoaded()) clearTimeout(timer);
        dataChanged();
      }, function (e) { LOADED[c] = true; toast('Data error (' + c + '): ' + (e && e.code)); dataChanged(); });
    });
    DB.doc('settings/main').onSnapshot(function (snap) { S.settings = snap.exists ? snap.data() : null; LOADED.settings = true; dataChanged(); }, function () { LOADED.settings = true; dataChanged(); });
  });
})();


/* ---------------- vehicle lines editor ---------------- */
var LINES = [], LINE_PRICE_KEY = 'unitPrice', LINE_TOTAL_FIELD = 'amount';
function linesOpts(lines, priceKey, priceLabel, totalField, base) {
  return Object.assign(base || {}, {
    extra: '<div class="card" style="margin:6px 0 0;padding:12px"><div class="row"><h2 style="margin:0">Vehicle lines</h2><span class="sp"></span><button type="button" class="sm" onclick="addLine()">Add line</button></div>' +
      '<p class="hint" style="margin:6px 0">One line per model (brand, model, trim). Used by the sales report: best sellers and most profitable models.</p>' +
      '<div class="row hint" style="margin-bottom:4px"><span style="flex:3">Model</span><span style="flex:1">Qty</span><span style="flex:1.4">' + esc(priceLabel) + '</span><span style="width:60px"></span></div><div id="lineRows"></div><div id="lineSum" class="hint"></div></div>',
    afterRender: function () { LINE_PRICE_KEY = priceKey; LINE_TOTAL_FIELD = totalField; LINES = (lines || []).map(function (l) { return { model: l.model, qty: l.qty, price: l[priceKey] }; }); renderLines(); if ($('f_' + totalField)) $('f_' + totalField).addEventListener('input', lineSummary); },
    onRead: function (o) {
      readLines();
      if (LINES.some(function (l) { return l.model && !(Number(l.qty) > 0); })) return 'Each vehicle line needs a quantity.';
      o.lines = LINES.filter(function (l) { return l.model && l.model.trim(); }).map(function (l) { var r = { model: l.model.trim(), qty: Number(l.qty) }; r[priceKey] = Number(l.price) || 0; return r; });
      if (o.lines.length && ('units' in o || $('f_units')) && !(Number(o.units) > 0)) o.units = o.lines.reduce(function (a, l) { return a + l.qty; }, 0);
      return '';
    }
  });
}
function renderLines() {
  if (!$('lineRows')) return;
  $('lineRows').innerHTML = LINES.map(function (l, i) {
    return '<div class="row" style="margin-bottom:6px"><input class="lm" style="flex:3;min-width:0" placeholder="e.g. Toyota Hilux 2.4 GL" value="' + esc(l.model) + '" oninput="readLines();lineSummary()">' +
      '<input class="lq" type="number" step="any" style="flex:1;min-width:0" value="' + esc(l.qty) + '" oninput="readLines();lineSummary()">' +
      '<input class="lp" type="number" step="any" style="flex:1.4;min-width:0" value="' + esc(l.price) + '" oninput="readLines();lineSummary()">' +
      '<button type="button" class="link" style="width:60px" onclick="readLines();LINES.splice(' + i + ',1);renderLines()">Remove</button></div>';
  }).join('') || '<div class="hint">No lines yet.</div>';
  lineSummary();
}
function readLines() {
  var m = document.querySelectorAll('.lm'), q = document.querySelectorAll('.lq'), p = document.querySelectorAll('.lp');
  LINES = Array.prototype.map.call(m, function (el, i) { return { model: el.value, qty: q[i].value === '' ? '' : parseFloat(q[i].value), price: p[i].value === '' ? '' : parseFloat(p[i].value) }; });
}
function addLine() { readLines(); LINES.push({ model: '', qty: 1, price: '' }); renderLines(); }
function lineSummary() {
  if (!$('lineSum')) return;
  if (!LINES.length) { $('lineSum').textContent = ''; return; }
  var tot = LINES.reduce(function (a, l) { return a + (Number(l.qty) || 0) * (Number(l.price) || 0); }, 0), qty = LINES.reduce(function (a, l) { return a + (Number(l.qty) || 0); }, 0);
  var doc = parseFloat(($('f_' + LINE_TOTAL_FIELD) || {}).value) || 0, diff = Math.round((doc - tot) * 100) / 100;
  $('lineSum').innerHTML = qty + ' vehicle(s) · lines total ' + fmt(tot, 2) + (doc ? (Math.abs(diff) < 0.01 ? ' · <span class="grn">matches the document total</span>' : ' · <span class="amb">differs from the document total by ' + fmt(diff, 2) + '</span> (other charges or a typo)') : '');
}

/* ---------------- payments ---------------- */
var PAY_FILTER = 'all';
function unallocatedNotice() {
  var open = S.transactions.filter(function (t) { return lgUnallocated(t) > 0.009; });
  if (!open.length) return '';
  var inUSD = 0, outUSD = 0;
  open.forEach(function (t) { var u = lgToUSD(lgUnallocated(t), t.ccy, t.rate); if (t.dir === 'IN') inUSD += u; else outUSD += u; });
  return '<div class="alert warning" onclick="PAY_FILTER=\'open\';go(\'payments\')"><div><b>' + open.length + ' movement(s) not fully allocated to jobs</b><br>' +
    (inUSD ? fmt(inUSD) + ' USD received from clients' : '') + (inUSD && outUSD ? ' · ' : '') + (outUSD ? fmt(outUSD) + ' USD paid to suppliers' : '') + ' · open Payments to allocate</div></div>';
}
function viewPayments() {
  var list = S.transactions.slice().sort(function (a, b) { return (b.date || '') < (a.date || '') ? -1 : 1; });
  if (PAY_FILTER === 'open') list = list.filter(function (t) { return lgUnallocated(t) > 0.009; });
  if (PAY_FILTER === 'in') list = list.filter(function (t) { return t.dir === 'IN'; });
  if (PAY_FILTER === 'out') list = list.filter(function (t) { return t.dir !== 'IN'; });
  app('<div class="row"><div><h1>Payments</h1><p class="sub">Every receipt and payment, with its allocation to jobs. One movement can be split across several jobs.</p></div><span class="sp"></span>' +
    (CAN_WRITE ? '<button onclick="importAdvice()">Import payment advice</button><button onclick="CUR_JOB=null;editTx(null,\'OUT\')">New payment</button><button class="pri" onclick="CUR_JOB=null;editTx(null,\'IN\')">New receipt</button>' : '') + '</div>' +
    '<div class="row" style="margin:10px 0 12px"><select style="max-width:240px" onchange="PAY_FILTER=this.value;viewPayments()">' +
    [['all', 'All movements'], ['open', 'Not fully allocated'], ['in', 'Receipts only'], ['out', 'Payments only']].map(function (o) { return '<option value="' + o[0] + '"' + (PAY_FILTER === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    '<div class="card">' + (list.length ? '<table class="t resp"><thead><tr><th>Date</th><th>Direction</th><th>Counterparty</th><th class="num">Amount</th><th>Allocated to</th><th class="num">Unallocated</th><th></th></tr></thead><tbody>' + list.map(function (t) {
      var al = lgAllocs(t), un = lgUnallocated(t);
      if (!al.length && t.jobId) al = [{ jobId: t.jobId, amount: t.amount }];
      return '<tr><td data-l="Date">' + fmtD(t.date) + '</td><td data-l="Direction">' + (t.dir === 'IN' ? '<span class="grn">Receipt</span>' : 'Payment · ' + esc(t.category)) + '</td>' +
        '<td data-l="Counterparty">' + esc(t.counterparty || '—') + '</td><td data-l="Amount" class="num">' + fmt(t.amount, 2) + ' ' + esc(t.ccy) + '</td>' +
        '<td data-l="Allocated to">' + (al.map(function (a) { return '<a href="#' + jobHash(a.jobId) + '">' + esc(a.jobId) + '</a> ' + fmt(a.amount, 2); }).join('<br>') || '—') + '</td>' +
        '<td data-l="Unallocated" class="num">' + (un > 0.009 ? pill('warning', fmt(un, 2) + ' ' + t.ccy) : '<span class="mut">—</span>') + '</td>' +
        '<td data-l="">' + (t.fileId ? '<a target="_blank" href="' + fileUrl(t.fileId) + '">Proof</a> ' : '') + (CAN_WRITE ? '<button class="link" onclick="editTx(\'' + t.id + '\')">' + (un > 0.009 ? 'Allocate' : 'Edit') + '</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table>' : '<div class="empty">Nothing to show.</div>') + '</div>');
}

/* ---------------- sales report ---------------- */
var REP = { period: 'all', from: '', to: '', realized: false };
function repRange() {
  var t = today(), y = t.slice(0, 4), m = +t.slice(5, 7);
  if (REP.period === 'ytd') return { from: y + '-01-01', to: t };
  if (REP.period === 'month') return { from: t.slice(0, 8) + '01', to: t };
  if (REP.period === 'quarter') { var q0 = Math.floor((m - 1) / 3) * 3 + 1; return { from: y + '-' + ('0' + q0).slice(-2) + '-01', to: t }; }
  if (REP.period === '12m') return { from: lgAddDays(t, -365), to: t };
  if (REP.period === 'custom') return { from: REP.from, to: REP.to };
  return { from: '', to: '' };
}
function hbars(rows, valKey, labelFn, extraFn, max) {
  if (!rows.length) return '<div class="empty">No data for this period.</div>';
  var top = Math.max.apply(null, rows.map(function (r) { return Math.abs(r[valKey]); }).concat([1]));
  return rows.slice(0, max || 10).map(function (r) {
    var w = Math.max(2, Math.round(Math.abs(r[valKey]) / top * 100));
    return '<div style="margin:0 0 9px"><div class="row" style="font-size:13px"><span>' + labelFn(r) + '</span><span class="sp"></span><b>' + fmt(r[valKey]) + '</b></div>' +
      '<div class="bar" style="height:7px"><i style="width:' + w + '%;' + (r[valKey] < 0 ? 'background:var(--red)' : '') + '"></i></div>' + (extraFn ? '<div class="hint">' + extraFn(r) + '</div>' : '') + '</div>';
  }).join('');
}
function pct(n) { return (Math.round(n * 10) / 10).toFixed(1) + '%'; }
function buildReport() { var d = computed(), rg = repRange(); return lgReport(S.jobs, S.commitments, d.summaries, { from: rg.from, to: rg.to, realizedOnly: REP.realized }); }
function viewReport() {
  var R = buildReport(), T = R.totals, rg = repRange();
  var periodSel = '<select style="max-width:180px" onchange="REP.period=this.value;viewReport()">' + [['all', 'All time'], ['month', 'This month'], ['quarter', 'This quarter'], ['ytd', 'Year to date'], ['12m', 'Last 12 months'], ['custom', 'Custom dates']]
    .map(function (o) { return '<option value="' + o[0] + '"' + (REP.period === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
  var custom = REP.period === 'custom' ? '<input type="date" style="max-width:160px" value="' + esc(REP.from) + '" onchange="REP.from=this.value;viewReport()"><input type="date" style="max-width:160px" value="' + esc(REP.to) + '" onchange="REP.to=this.value;viewReport()">' : '';
  var maxMonth = Math.max.apply(null, R.months.map(function (m) { return m.revenue; }).concat([1]));
  app('<div class="row"><div><h1>Sales report</h1><p class="sub">Gross margin = sale − supplier cost − freight, inspection, BIETC, commission and other job costs. Period on sales PFI date' + (rg.from ? ' · ' + fmtD(rg.from) + ' to ' + fmtD(rg.to) : '') + '.</p></div><span class="sp"></span>' +
    (DL && window.XLSX ? '<button onclick="exportReport()">Export report to Excel</button>' : '') + '</div>' +
    '<div class="row" style="margin:6px 0 14px">' + periodSel + custom + '<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" style="width:auto"' + (REP.realized ? ' checked' : '') + ' onchange="REP.realized=this.checked;viewReport()"> Shipped jobs only (realised margin)</label></div>' +
    '<div class="grid g4" style="margin-bottom:14px"><div class="kpi"><p>Revenue (USD)</p><b>' + fmt(T.revenue) + '</b><span class="hint">' + T.jobs + ' job(s) · ' + T.units + ' vehicle(s)</span></div>' +
    '<div class="kpi"><p>Gross margin (USD)</p><b class="' + (T.margin < 0 ? 'red' : 'grn') + '">' + fmt(T.margin) + '</b><span class="hint">' + pct(T.marginPct) + ' of revenue</span></div>' +
    '<div class="kpi"><p>Realised (shipped jobs)</p><b>' + fmt(T.realized) + '</b><span class="hint">expected on open jobs ' + fmt(T.expected) + '</span></div>' +
    '<div class="kpi"><p>Margin per vehicle</p><b>' + fmt((function () { var u = R.models.reduce(function (x, m) { return x + (m.revCost > 0 ? m.units : 0); }, 0); return u ? T.margin / u : 0; })()) + '</b><span class="hint">supplier cost ' + fmt(T.supplierCost) + ' · other ' + fmt(T.otherCost) + '</span></div></div>' +
    (T.missingCost ? '<div class="alert warning" style="cursor:default"><div><b>' + T.missingCost + ' job(s) have no supplier cost yet</b>: they count in revenue and units but are left out of every margin figure until the supplier PFI or quote is entered.</div></div>' : '') +
    '<div class="card"><h2>Gross margin by job</h2>' + (R.jobs.length ? '<table class="t resp"><thead><tr><th>Job</th><th>Client</th><th>Country</th><th>Status</th><th class="num">Revenue</th><th class="num">Supplier</th><th class="num">Other costs</th><th class="num">Margin</th><th class="num">%</th></tr></thead><tbody>' +
      R.jobs.map(function (r) { return '<tr class="click" onclick="go(\'' + jobHash(r.jobId) + '\')"><td data-l="Job"><b>' + esc(r.jobId) + '</b></td><td data-l="Client">' + esc(r.client) + '</td><td data-l="Country">' + esc(r.country || '') + '</td>' +
        '<td data-l="Status">' + (r.realized ? pill('ok', 'realised') : pill('info', 'expected')) + (r.missingCost ? ' ' + pill('warning', 'no cost') : '') + '</td><td data-l="Revenue" class="num">' + fmt(r.revenue) + '</td><td data-l="Supplier" class="num">' + fmt(r.supplierCost) + '</td>' +
        '<td data-l="Other costs" class="num">' + fmt(r.otherCost) + '</td><td data-l="Margin" class="num ' + (r.margin < 0 ? 'red' : '') + '"><b>' + fmt(r.margin) + '</b></td><td data-l="%" class="num">' + pct(r.marginPct) + '</td></tr>'; }).join('') +
      '<tr><td colspan="4"><b>Total</b></td><td class="num"><b>' + fmt(T.revenue) + '</b></td><td class="num">' + fmt(T.supplierCost) + '</td><td class="num">' + fmt(T.otherCost) + '</td><td class="num"><b>' + fmt(T.margin) + '</b></td><td class="num">' + pct(T.marginPct) + '</td></tr></tbody></table>' : '<div class="empty">No jobs in this period.</div>') + '</div>' +
    '<div class="grid g2"><div class="card"><h2>Top clients by revenue</h2>' + hbars(R.clients, 'revenue', function (r) { return esc(r.label) + (r.country ? ' <span class="mut">· ' + esc(r.country) + '</span>' : ''); }, function (r) { return 'margin ' + fmt(r.margin) + ' (' + pct(r.marginPct) + ') · ' + r.jobs + ' job(s) · ' + r.units + ' vehicle(s) · ' + pct(T.revenue ? r.revenue / T.revenue * 100 : 0) + ' of revenue'; }) + '</div>' +
    '<div class="card"><h2>Top clients by gross margin</h2>' + hbars(R.clients.slice().sort(function (a, b) { return b.margin - a.margin; }), 'margin', function (r) { return esc(r.label); }, function (r) { return pct(r.marginPct) + ' margin rate · revenue ' + fmt(r.revenue); }) + '</div></div>' +
    '<div class="grid g2"><div class="card"><h2>Geography (destination country)</h2>' + hbars(R.countries, 'revenue', function (r) { return esc(r.label); }, function (r) { return (r.clientCount || 0) + ' client(s) · ' + r.jobs + ' job(s) · ' + r.units + ' vehicle(s) · margin ' + fmt(r.margin) + ' (' + pct(r.marginPct) + ')'; }) + '</div>' +
    '<div class="card"><h2>Largest suppliers (purchases USD)</h2>' + hbars(R.suppliers, 'purchases', function (r) { return esc(r.label); }, function (r) { return r.jobs + ' job(s)' + (r.units ? ' · ' + r.units + ' vehicle(s)' : '') + ' · margin on their jobs ' + pct(r.marginPct); }) + '</div></div>' +
    '<div class="grid g2"><div class="card"><h2>Best-selling models (units)</h2>' + hbars(R.models.slice().sort(function (a, b) { return b.units - a.units; }), 'units', function (r) { return esc(r.label); }, function (r) { return 'revenue ' + fmt(r.revenue) + ' · ' + r.jobs + ' job(s)'; }) + '</div>' +
    '<div class="card"><h2>Most profitable models (gross margin)</h2>' + hbars(R.models, 'margin', function (r) { return esc(r.label); }, function (r) { return pct(r.marginPct) + ' · ' + fmt(r.marginPerUnit) + ' per vehicle · ' + r.units + ' sold'; }) + '</div></div>' +
    '<div class="grid g2"><div class="card"><h2>Brands</h2>' + hbars(R.brands, 'revenue', function (r) { return esc(r.label); }, function (r) { return r.units + ' vehicle(s) · margin ' + fmt(r.margin) + ' (' + pct(r.marginPct) + ')'; }) + '</div>' +
    '<div class="card"><h2>Monthly trend (sales PFI date)</h2>' + (R.months.length ? '<div style="display:flex;gap:8px;align-items:flex-end;height:170px;padding-top:10px">' + R.months.map(function (m) {
      var h = Math.max(3, Math.round(m.revenue / maxMonth * 130)), hm = Math.max(0, Math.round(Math.max(0, m.margin) / maxMonth * 130));
      return '<div style="flex:1;text-align:center;font-size:11px;color:var(--mut)"><div style="display:flex;gap:2px;align-items:flex-end;justify-content:center;height:132px"><div title="Revenue ' + fmt(m.revenue) + '" style="width:40%;height:' + h + 'px;background:var(--acc);border-radius:3px 3px 0 0"></div><div title="Margin ' + fmt(m.margin) + '" style="width:40%;height:' + hm + 'px;background:var(--grn);border-radius:3px 3px 0 0"></div></div>' + esc(m.label.slice(2)) + '</div>';
    }).join('') + '</div><p class="hint">Blue: revenue · green: gross margin (hover for amounts)</p>' : '<div class="empty">No data.</div>') + '</div></div>');
}
function exportReport() {
  var R = buildReport(), wb = XLSX.utils.book_new(), rg = repRange();
  var add = function (name, rows) { XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{}]), name); };
  var r2 = function (n) { return Math.round(n * 100) / 100; };
  add('Totals', [{ From: rg.from || 'all', To: rg.to || 'all', 'Shipped only': REP.realized ? 'yes' : 'no', 'Revenue USD': R.totals.revenue, 'Supplier cost USD': R.totals.supplierCost, 'Other costs USD': R.totals.otherCost, 'Gross margin USD': R.totals.margin, 'Margin %': r2(R.totals.marginPct), Jobs: R.totals.jobs, Vehicles: R.totals.units, 'Realised margin USD': R.totals.realized, 'Expected margin USD': R.totals.expected }]);
  add('Margin by job', R.jobs.map(function (r) { return { Job: r.jobId, 'Sales PFI': r.pfi, Client: r.client, Country: r.country, 'PFI date': r.pfiDate, ETD: r.etd, Status: r.status, Realised: r.realized ? 'yes' : 'no', 'Revenue USD': r.revenue, 'Supplier cost USD': r.supplierCost, 'Other costs USD': r.otherCost, 'Gross margin USD': r.margin, 'Margin %': r2(r.marginPct), Vehicles: r.units }; }));
  var grp = function (rows, extra) { return rows.map(function (r) { return Object.assign({ Name: r.label, 'Revenue USD': r2(r.revenue), 'Gross margin USD': r2(r.margin), 'Margin %': r2(r.marginPct), Jobs: r.jobs, Vehicles: r.units }, extra ? extra(r) : {}); }); };
  add('Clients', grp(R.clients, function (r) { return { Country: r.country }; })); add('Countries', grp(R.countries, function (r) { return { Clients: r.clientCount }; }));
  add('Suppliers', grp(R.suppliers, function (r) { return { 'Purchases USD': r2(r.purchases) }; })); add('Models', grp(R.models, function (r) { return { 'Cost USD': r2(r.cost), 'Margin per vehicle USD': r.marginPerUnit }; }));
  add('Brands', grp(R.brands)); add('Months', grp(R.months));
  DL.save({ filename: 'TKX_Sales_Report_' + today() + '.xlsx', data: new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })]) })
    .then(function (r) { if (r && r.status === 'saved') toast('Report saved'); }, function (e) { if (e && e.code !== 'declined') toast('Export failed: ' + (e.message || e.code)); });
}
</script>
