<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKX Export Jobs</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TKX Jobs"><meta name="theme-color" content="#1F1F1D"><style>
:root{--bg:#F6F5F2;--card:#FFFFFF;--soft:#F1EFE8;--line:#E3E1DA;--txt:#1F1F1D;--mut:#6B6A65;--acc:#185FA5;--acc-bg:#E6F1FB;
--red:#A32D2D;--red-bg:#FCEBEB;--amb:#854F0B;--amb-bg:#FAEEDA;--grn:#3B6D11;--grn-bg:#EAF3DE;--r:8px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:var(--acc);text-decoration:none}
header.top{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .brand{font-weight:600;font-size:15px;white-space:nowrap}
nav.main{display:flex;gap:4px;flex:1}
nav.main a{padding:7px 12px;border-radius:var(--r);color:var(--mut)}
nav.main a.on{background:var(--soft);color:var(--txt);font-weight:500}
.user{font-size:12px;color:var(--mut);white-space:nowrap}
main{padding:18px 20px 90px;max-width:1280px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}h2{font-size:15px;font-weight:600;margin:0 0 10px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi p{margin:0;font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:20px;font-weight:600;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--mut);padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#FAFAF7}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;background:var(--soft);color:var(--mut)}
.p-danger{background:var(--red-bg);color:var(--red)}.p-warning{background:var(--amb-bg);color:var(--amb)}
.p-info{background:var(--acc-bg);color:var(--acc)}.p-ok{background:var(--grn-bg);color:var(--grn)}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:3px;min-width:60px}.bar i{display:block;height:100%;background:var(--acc)}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--grn);margin-right:2px}
.dots span.on{background:var(--grn)}.dots span.na{border-color:var(--line);background:var(--soft)}
.red{color:var(--red)}.grn{color:var(--grn)}.amb{color:var(--amb)}.mut{color:var(--mut)}
button,.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;white-space:nowrap}
button:hover{background:var(--soft)}button.pri{background:var(--txt);color:#fff;border-color:var(--txt)}button.pri:hover{background:#3a3a37}
button.sm{padding:4px 8px;font-size:12px}button.link{border:none;background:none;color:var(--acc);padding:2px 4px}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%;color:var(--txt)}
textarea{min-height:64px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}label.f>input,label.f>select,label.f>textarea{margin-top:3px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.fgrid .full{grid-column:1/-1}
.timeline{display:flex;gap:2px;margin:6px 0 4px}
.timeline .st{flex:1;text-align:center;font-size:11px;color:var(--mut)}

nav.bottom{display:none}

<script>/* logic_en.js — pure business logic (no I/O). Dates are 'YYYY-MM-DD' strings; reporting currency USD. */

var LOGIC_DEFAULTS = {
  CLIENT_DAYS_BEFORE_ETD: 10,
  SUPPLIER_DAYS_BEFORE_ETD: 0,
  FREIGHT_DAYS_BEFORE_ETD: 0,
  WARN_DAYS: 5,
  ETD_NOTICE_DAYS: 7,
  ETA_NOTICE_DAYS: 5,
  BL_DAYS_AFTER_ETD: 7,
  PRESHIP_DOC_DAYS_BEFORE_ETD: 3,
  DOC_SEND_DAYS: 2,
  TOLERANCE_USD: 50
};
var CLIENT_FACING_DOCS = ['BL', 'BIETC', 'Inspection', 'Sales invoice', 'Certificate of origin', 'Packing list'];
var PRESHIP_DOCS = ['BIETC', 'Inspection'];
var COMMIT_CATEGORIES = ['Supplier', 'Freight', 'Inspection', 'BIETC', 'Commission', 'Other'];
var CLOSED_STATUSES = ['Closed', 'Cancelled'];

function lgCfg(cfg) {
  var out = {};
  for (var k in LOGIC_DEFAULTS) out[k] = LOGIC_DEFAULTS[k];
  if (cfg) for (var c in cfg) {
    if (cfg[c] === '' || cfg[c] === null || cfg[c] === undefined) continue;
    out[c] = (typeof LOGIC_DEFAULTS[c] === 'number') ? Number(cfg[c]) : cfg[c];
  }
  return out;
}
function lgDay(s) {
  if (!s) return null;
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000);
}
function lgDate(day) { if (day === null || day === undefined) return ''; return new Date(day * 86400000).toISOString().slice(0, 10); }
function lgAddDays(s, n) { var d = lgDay(s); return d === null ? '' : lgDate(d + n); }
function lgNum(v) { if (v === null || v === undefined || v === '') return 0; if (typeof v === 'number') return v; return lgParseAmount(String(v)); }
function lgParseAmount(s) {
  s = String(s).replace(/[\s ']/g, '');
  if (!s) return 0;
  var lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) { s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (lc > -1) {
    var dec = s.length - lc - 1, commas = (s.match(/,/g) || []).length;
    s = (commas === 1 && dec !== 3) ? s.replace(',', '.') : s.replace(/,/g, '');
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function lgToUSD(amount, ccy, rate) {
  amount = lgNum(amount);
  if (!ccy || ccy === 'USD') return amount;
  var r = lgNum(rate);
  return r > 0 ? amount / r : 0;
}
function lgRound(n) { return Math.round(n * 100) / 100; }
function lgTrue(v) { return v === true || v === 'TRUE' || v === 'true' || v === 1; }

function lgSummarizeJob(job, commitments, txs, docs, cfg, today) {
  cfg = lgCfg(cfg);
  var tol = cfg.TOLERANCE_USD;
  var s = { jobId: job.jobId, pfi: job.salesPfi, client: job.client, country: job.country,
    etd: job.etd || '', eta: job.eta || '', manualStatus: job.status || '',
    saleUSD: lgRound(lgToUSD(job.saleAmount, job.saleCcy, job.saleRate)),
    receivedUSD: 0, commit: {}, paid: {}, due: {}, deadlines: {}, missingFx: false, cashWithoutProof: 0 };
  COMMIT_CATEGORIES.forEach(function (c) { s.commit[c] = 0; s.paid[c] = 0; s.due[c] = 0; });
  if (job.saleCcy && job.saleCcy !== 'USD' && !(lgNum(job.saleRate) > 0)) s.missingFx = true;
  var earliest = {};
  commitments.forEach(function (e) {
    var cat = COMMIT_CATEGORIES.indexOf(e.category) > -1 ? e.category : 'Other';
    if (e.ccy && e.ccy !== 'USD' && !(lgNum(e.rate) > 0)) s.missingFx = true;
    s.commit[cat] += lgToUSD(e.amount, e.ccy, e.rate);
    if (e.dueDate) { var d = lgDay(e.dueDate); if (earliest[cat] === undefined || d < earliest[cat]) earliest[cat] = d; }
  });
  txs.forEach(function (t) {
    if (t.ccy && t.ccy !== 'USD' && !(lgNum(t.rate) > 0)) s.missingFx = true;
    var usd = lgToUSD(t.amount, t.ccy, t.rate);
    if (t.dir === 'IN') s.receivedUSD += usd;
    else {
      var cat = COMMIT_CATEGORIES.indexOf(t.category) > -1 ? t.category : 'Other';
      s.paid[cat] += usd;
      if (t.mode === 'Cash' && !t.fileId) s.cashWithoutProof++;
    }
  });
  var tc = 0, tp = 0;
  COMMIT_CATEGORIES.forEach(function (c) {
    s.commit[c] = lgRound(s.commit[c]); s.paid[c] = lgRound(s.paid[c]);
    s.due[c] = lgRound(Math.max(0, s.commit[c] - s.paid[c])); if (s.due[c] < tol) s.due[c] = 0;
    tc += s.commit[c]; tp += s.paid[c];
  });
  s.receivedUSD = lgRound(s.receivedUSD);
  s.receivableUSD = lgRound(Math.max(0, s.saleUSD - s.receivedUSD)); if (s.receivableUSD < tol) s.receivableUSD = 0;
  s.totalCommitUSD = lgRound(tc); s.totalPaidUSD = lgRound(tp);
  s.totalDueUSD = lgRound(COMMIT_CATEGORIES.reduce(function (a, c) { return a + s.due[c]; }, 0));
  s.cashNetUSD = lgRound(s.receivedUSD - s.totalPaidUSD);
  s.expectedMarginUSD = lgRound(s.saleUSD - s.totalCommitUSD);
  s.pctReceived = s.saleUSD > 0 ? Math.min(100, Math.round(s.receivedUSD / s.saleUSD * 100)) : 0;
  s.pctSupplierPaid = s.commit.Supplier > 0 ? Math.min(100, Math.round(s.paid.Supplier / s.commit.Supplier * 100)) : 0;
  if (s.etd) {
    s.deadlines.client = lgAddDays(s.etd, -cfg.CLIENT_DAYS_BEFORE_ETD);
    s.deadlines.Supplier = lgAddDays(s.etd, -cfg.SUPPLIER_DAYS_BEFORE_ETD);
    s.deadlines.Freight = lgAddDays(s.etd, -cfg.FREIGHT_DAYS_BEFORE_ETD);
  }
  COMMIT_CATEGORIES.forEach(function (c) {
    if (earliest[c] !== undefined) {
      var rule = s.deadlines[c] ? lgDay(s.deadlines[c]) : null;
      s.deadlines[c] = lgDate(rule === null ? earliest[c] : Math.min(rule, earliest[c]));
    } else if (!s.deadlines[c] && s.etd) s.deadlines[c] = s.etd;
  });
  var req = 0, rec = 0, toSend = 0;
  s.docs = docs.map(function (d) {
    var required = d.status !== 'N/A'; if (required) req++;
    var received = d.status === 'Received'; if (required && received) rec++;
    var mustSend = received && CLIENT_FACING_DOCS.indexOf(d.type) > -1 && !lgTrue(d.sentToClient);
    if (mustSend) toSend++;
    return { id: d.id, type: d.type, status: d.status, sent: lgTrue(d.sentToClient), mustSend: mustSend };
  });
  s.docsRequired = req; s.docsReceived = rec; s.docsToSend = toSend;
  s.status = lgStatus(s, today);
  return s;
}
function lgStatus(s, today) {
  if (CLOSED_STATUSES.indexOf(s.manualStatus) > -1) return s.manualStatus;
  var t = lgDay(today), etd = lgDay(s.etd), eta = lgDay(s.eta), phase = 'Preparing';
  if (etd !== null && t >= etd) phase = 'At sea';
  if (eta !== null && t >= eta) phase = 'Arrived';
  if (phase === 'Arrived' && s.receivableUSD === 0 && s.totalDueUSD === 0 && s.docsReceived >= s.docsRequired && s.docsToSend === 0) phase = 'Ready to close';
  return phase;
}
function lgSchedule(summaries) {
  var rec = [], pay = [];
  summaries.forEach(function (s) {
    if (CLOSED_STATUSES.indexOf(s.status) > -1) return;
    if (s.receivableUSD > 0) rec.push({ jobId: s.jobId, pfi: s.pfi, party: s.client, label: 'Client balance', amountUSD: s.receivableUSD, date: s.deadlines.client || '' });
    COMMIT_CATEGORIES.forEach(function (c) { if (s.due[c] > 0) pay.push({ jobId: s.jobId, pfi: s.pfi, party: s.client, label: c, amountUSD: s.due[c], date: s.deadlines[c] || '' }); });
  });
  var byDate = function (a, b) { return (a.date || '9999') < (b.date || '9999') ? -1 : 1; };
  return { receivables: rec.sort(byDate), payables: pay.sort(byDate) };
}
function lgAlerts(summaries, docsByJob, cfg, today) {
  cfg = lgCfg(cfg);
  var t = lgDay(today), out = [];
  function push(level, s, type, msg, date, amount) {
    out.push({ level: level, jobId: s.jobId, pfi: s.pfi, client: s.client, type: type, message: msg, date: date || '', amountUSD: amount || 0 });
  }
  function check(s, amount, date, late, soon) {
    if (!(amount > 0) || !date) return;

    '<div class="jm-models">' + (models.length ? models.slice(0, 3).map(function (l) { return esc(l.qty + ' × ' + l.model); }).join('<br>') + (models.length > 3 ? '<br>+ ' + (models.length - 3) + ' more' : '') : '<span class="mut">no vehicle lines</span>') + '</div>' +
    '<div style="margin-top:6px">' + statusPill(s.status) + (margin !== null ? ' <span class="pill">margin ' + margin + '%</span>' : '') + '</div>' +
    '<div class="jm-cash">Net cash ' + '<b class="' + (s.cashNetUSD < 0 ? 'red' : 'grn') + '">' + fmt(s.cashNetUSD, 0) + '</b> USD</div></div>';

  app('<div class="row jm-top"><div><a href="#' + jh + '" class="hint">← ' + esc(id) + '</a><h1>Job map · ' + esc(j.salesPfi || id) + '</h1></div><span class="sp"></span><button onclick="window.print()">Print</button><button onclick="location.hash=\'' + jh + '\'">Job details</button></div>' +
    '<div class="card">' + jmShip(D) + '</div>' +
    '<div class="jm-grid" id="jmGrid"><svg class="jm-links" id="jmLinks"></svg>' +
    '<div class="jm-a-rec">' + recCard + '</div><div class="jm-a-sup">' + supCard + '</div><div class="jm-a-mid">' + centre + '</div><div class="jm-a-cli">' + cliCard + '</div><div class="jm-a-pay">' + payCard + '</div></div>' +
    '<div class="jm-legend"><span class="lv-ok"><i></i>done</span><span class="lv-warning"><i></i>in progress</span><span class="lv-danger"><i></i>overdue</span><span class="lv-na"><i></i>no data</span></div>');
  requestAnimationFrame(jmLinks);
}
function jmLinks() {
  var g = $('jmGrid'), svg = $('jmLinks'); if (!g || !svg) return;
  var c = g.querySelector('.jm-centre'); if (!c || getComputedStyle(svg).display === 'none') return;
  var gb = g.getBoundingClientRect(), cb = c.getBoundingClientRect(), cx = cb.left - gb.left + cb.width / 2, cy = cb.top - gb.top + cb.height / 2;
  svg.setAttribute('viewBox', '0 0 ' + gb.width + ' ' + gb.height); svg.style.width = gb.width + 'px'; svg.style.height = gb.height + 'px';
  var paths = '';
  g.querySelectorAll('.jm-card').forEach(function (el) {
    var b = el.getBoundingClientRect(), x = b.left - gb.left, y = b.top - gb.top, w = b.width, h = b.height, px, py, qx, qy;
    if (el.classList.contains('jm-sup')) { px = x + w; py = y + h / 2; qx = cb.left - gb.left; qy = cy; }
    else if (el.classList.contains('jm-cli')) { px = x; py = y + h / 2; qx = cb.right - gb.left; qy = cy; }
    else if (el.classList.contains('jm-rec')) { px = x + w / 2; py = y + h; qx = cx; qy = cb.top - gb.top; }
    else { px = x + w / 2; py = y; qx = cx; qy = cb.bottom - gb.top; }
    var col = getComputedStyle(el).borderTopColor;
    var horiz = el.classList.contains('jm-sup') || el.classList.contains('jm-cli');
    var d = horiz ? 'M' + px + ' ' + py + ' C' + (px + qx) / 2 + ' ' + py + ' ' + (px + qx) / 2 + ' ' + qy + ' ' + qx + ' ' + qy : 'M' + px + ' ' + py + ' C' + px + ' ' + (py + qy) / 2 + ' ' + qx + ' ' + (py + qy) / 2 + ' ' + qx + ' ' + qy;
    paths += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2"/>';
  });
  svg.innerHTML = paths;
}
window.addEventListener('resize', function () { if (/^#map-/.test(location.hash)) jmLinks(); });
</script>
